name: CI/CD (Offline Delivery, GitOps deploy 分支)

# 推 main 触发;CI 用 kubectl apply -k 直推部署(绕开 Argo fetch 不稳),
# deploy/staging 回写降级为 best-effort(GitOps 记录)。main 保持干净。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: [self-hosted, linux, x64]
    env:
      BACKEND_IMAGE: localhost:5000/offline-delivery-backend
      FRONTEND_IMAGE: localhost:5000/offline-delivery-frontend
      # github.com HTTPS 在本节点被重置(Recv failure),统一走 SSH 部署密钥拉取/推送。
      GIT_SSH_COMMAND: "ssh -i /home/mrlu/.ssh/kunlun_deploy -o StrictHostKeyChecking=accept-new"
    steps:
      - name: 拉代码(SSH,带重试)
        run: |
          repo="git@github.com:Mr-AppleDog/offline-deploy-docker.git"
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "clone 第 ${attempt} 次"
            # 清空上一次残留(含未提交的 kustomize 改动),git clone 需要空目录。
            shopt -s dotglob
            rm -rf ./*
            shopt -u dotglob
            if git clone --depth 1 "$repo" .; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "SSH clone 连续 5 次失败"; exit 1; }
          git log -1 --oneline

      - name: 计算镜像 tag
        id: tag
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: 检查本地 registry 是否已有当前提交镜像
        id: registry
        env:
          TAG: ${{ steps.tag.outputs.sha }}
        run: |
          accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          if curl -fsS -o /dev/null -H "Accept: $accept" \
              "http://localhost:5000/v2/offline-delivery-backend/manifests/$TAG" \
            && curl -fsS -o /dev/null -H "Accept: $accept" \
              "http://localhost:5000/v2/offline-delivery-frontend/manifests/$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "registry 已有 $TAG，复用已验证镜像"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "registry 中无完整 $TAG，进入测试和构建"
          fi

      - name: 后端单元测试(门槛)
        if: steps.registry.outputs.exists != 'true'
        run: |
          # 以 runner 用户运行,避免 mvn 编译产物 backend/target/** 落盘为 root 属主,
          # 否则下一次 checkout clean 会因权限不够失败。
          mkdir -p /home/mrlu/.m2-kunlun
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v /home/mrlu/.m2-kunlun:/tmp/.m2 \
            -v "$PWD/backend":/ws \
            -w /ws \
            maven:3.9-eclipse-temurin-17 \
            mvn -B -q -Dmaven.repo.local=/tmp/.m2/repository test

      - name: 构建后端镜像
        if: steps.registry.outputs.exists != 'true'
        run: docker build -f backend/Dockerfile -t $BACKEND_IMAGE:${{ steps.tag.outputs.sha }} .

      - name: 构建前端镜像
        if: steps.registry.outputs.exists != 'true'
        run: docker build -f frontend/Dockerfile -t $FRONTEND_IMAGE:${{ steps.tag.outputs.sha }} frontend

      - name: 推送到本地 registry
        if: steps.registry.outputs.exists != 'true'
        run: |
          docker push $BACKEND_IMAGE:${{ steps.tag.outputs.sha }}
          docker push $FRONTEND_IMAGE:${{ steps.tag.outputs.sha }}

      - name: 清理本次镜像副本(保留 Maven 镜像与构建缓存)
        if: ${{ always() && steps.registry.outputs.exists != 'true' }}
        run: |
          # 已推送的 commit 镜像由本地 registry 保存；只删除 runner 上的同名副本。
          # Maven 基础镜像和 BuildKit 构建缓存不自动清理，磁盘不足时由运维手动执行
          # scripts/cleanup-ci-cache.sh。
          docker image rm \
            $BACKEND_IMAGE:${{ steps.tag.outputs.sha }} \
            $FRONTEND_IMAGE:${{ steps.tag.outputs.sha }} || true

      - name: 更新 GitOps 镜像标签
        env:
          TAG: ${{ steps.tag.outputs.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          tag = os.environ["TAG"]
          p = Path("deploy/gitops/overlays/staging/kustomization.yaml")
          lines = p.read_text(encoding="utf-8").splitlines()
          # 两条 images 条目各有一个 newTag，全部替换成本次 sha。
          hit = 0
          for i, line in enumerate(lines):
              if line.strip().startswith("newTag:"):
                  indent = line[: len(line) - len(line.lstrip())]
                  lines[i] = f"{indent}newTag: {tag}"
                  hit += 1
          if hit != 2:
              raise SystemExit(f"ERROR: kustomization.yaml 里应有两处 newTag，实际 {hit} 处")
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"newTag -> {tag} (x{hit})")
          PY

      - name: 渲染校验
        env:
          TAG: ${{ steps.tag.outputs.sha }}
        run: |
          export PATH=/usr/local/bin:$PATH
          kubectl kustomize deploy/gitops/overlays/staging > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml
          grep -q "localhost:5000/offline-delivery-backend:$TAG" /tmp/rendered.yaml \
            || { echo "渲染后后端镜像未替换为本次 sha"; exit 1; }
          grep -q "localhost:5000/offline-delivery-frontend:$TAG" /tmp/rendered.yaml \
            || { echo "渲染后前端镜像未替换为本次 sha"; exit 1; }

      - name: kubectl 直推部署(apply -k, 绕开 Argo fetch 不稳)
        env:
          KUBECONFIG: /home/mrlu/.kube/config
        run: |
          export PATH=/usr/local/bin:$PATH
          kubectl create namespace offline-delivery 2>/dev/null || true
          kubectl apply -k deploy/gitops/overlays/staging

          rollout() {
            deployment="$1"
            if kubectl rollout status "deployment/$deployment" -n offline-delivery --timeout=300s; then
              return 0
            fi

            echo "::group::${deployment} rollout 诊断"
            kubectl get deployment "$deployment" -n offline-delivery -o wide || true
            kubectl get replicaset,pod -n offline-delivery -l "app=$deployment" -o wide || true
            kubectl describe deployment "$deployment" -n offline-delivery || true
            kubectl describe pod -n offline-delivery -l "app=$deployment" || true
            kubectl get events -n offline-delivery --sort-by=.lastTimestamp | tail -n 100 || true
            echo "::endgroup::"
            return 1
          }

          rollout offline-delivery-backend
          rollout offline-delivery-frontend

      - name: 冒烟测试(NodePort 30088)
        run: |
          for i in $(seq 1 30); do
            front=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://192.168.149.128:30088/ || echo 000)
            api=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://192.168.149.128:30088/api/health/live || echo 000)
            if [ "$front" = "200" ] && [ "$api" = "200" ]; then
              echo "smoke OK (frontend=$front, /api/health/live=$api)"
              exit 0
            fi
            sleep 2
          done
          echo "smoke: 60s 内未达到 200 (frontend=$front, api=$api)" >&2
          kubectl get pods -n offline-delivery -o wide
          exit 1

      - name: 回写 deploy/staging(GitOps 记录, best-effort)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/gitops/overlays/staging/kustomization.yaml
          git commit -m "deploy(staging): ${{ steps.tag.outputs.sha }}"
          for i in $(seq 1 6); do
            if git push --force origin HEAD:deploy/staging; then echo "push OK 第${i}次"; exit 0; fi
            sleep 15
          done
          echo "deploy/staging push 失败(非关键,已用 kubectl 直推部署)" >&2
