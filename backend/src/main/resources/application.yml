server:
  port: 8080

spring:
  application:
    name: offline-delivery-studio
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  # 运行时账号和密码只由 compose.app.yml 注入，应用镜像内不保留账号默认值。
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/offline_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:3s}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:}
    password: ${SPRING_RABBITMQ_PASSWORD:}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:demo-bucket}

logging:
  level:
    root: info

kunlun:
  platform:
    data-dir: ${KUNLUN_PLATFORM_DATA_DIR:../.kunlun-builder}
    project-root: ${KUNLUN_PROJECT_ROOT:..}
    secret-key: ${KUNLUN_SECRET_KEY:}
    max-analysis-files: ${KUNLUN_MAX_ANALYSIS_FILES:6000}
    command-timeout-minutes: ${KUNLUN_COMMAND_TIMEOUT_MINUTES:60}
    application-registry-url: ${KUNLUN_APPLICATION_REGISTRY_URL:http://localhost:5000}
    application-registry-pull-authority: ${KUNLUN_APPLICATION_REGISTRY_PULL_AUTHORITY:localhost:5000}
    metadata:
      jdbc-url: ${KUNLUN_METADB_URL:}
      username: ${KUNLUN_METADB_USER:}
      password: ${KUNLUN_METADB_PASSWORD:}
    storage:
      type: ${KUNLUN_STORAGE_TYPE:local}
      minio-endpoint: ${KUNLUN_MINIO_ENDPOINT:}
      minio-access-key: ${KUNLUN_MINIO_ACCESS_KEY:}
      minio-secret-key: ${KUNLUN_MINIO_SECRET_KEY:}
      minio-bucket: ${KUNLUN_MINIO_BUCKET:kunlun-platform}
  legacy-health:
    enabled: false

spring.servlet.multipart:
  location: ${KUNLUN_PLATFORM_DATA_DIR:../.kunlun-builder}/tmp
  max-file-size: 20GB
  max-request-size: 20GB
