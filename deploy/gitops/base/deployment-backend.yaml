apiVersion: apps/v1
kind: Deployment
metadata:
  name: offline-delivery-backend
  labels:
    app: offline-delivery-backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: offline-delivery-backend
  template:
    metadata:
      labels:
        app: offline-delivery-backend
    spec:
      # 特权构建引擎:挂载 host docker.sock 去执行 buildx / git clone,等价主机级构建权限。
      # 仅部署在受控 LAN 构建节点,勿暴露公网。
      containers:
        - name: offline-delivery-backend
          # 逻辑名,由 overlays/staging 的 images 改写为
          # localhost:5000/offline-delivery-backend:<tag>;实际 tag 由 CI workflow 在线覆盖。
          image: offline-delivery-backend:placeholder
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KUNLUN_PLATFORM_DATA_DIR
              value: /data
            - name: KUNLUN_PROJECT_ROOT
              value: /workspace
            - name: TZ
              value: Asia/Shanghai
            - name: KUNLUN_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: offline-delivery-admin-token
                  key: KUNLUN_ADMIN_TOKEN
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: data
          persistentVolumeClaim:
            claimName: offline-delivery-data
