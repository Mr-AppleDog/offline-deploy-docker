services:
  # ===================== 中间件层（数据用宿主目录 bind mount，明文落在 ./middleware/**） =====================
  mysql:
    image: mysql:8.4
    container_name: mysql
    hostname: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mrlu}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./middleware/mysql/data:/var/lib/mysql                # 数据
      - ./middleware/mysql/conf:/etc/mysql/conf.d             # 自定义配置(可空)
      - ./middleware/mysql/init:/docker-entrypoint-initdb.d   # 首次启动自动执行的 .sql

  redis:
    image: redis:8.2
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-mrlu}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./middleware/redis/data:/data                         # RDB/AOF 持久化

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: rabbitmq
    hostname: rabbitmq                          # 固定主机名，保证 mnesia 节点名重启不变
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-mrlu}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./middleware/rabbitmq/data:/var/lib/rabbitmq          # mnesia 消息数据

  minio:
    image: minio/minio:latest                  # 建议改成固定的 RELEASE 版本号
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mrlu}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mrlumrlu}   # ≥8 位
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./middleware/minio/data:/data                          # 对象存储

  # ===================== 应用层 =====================
  backend:
    image: offline-demo-backend:${APP_VERSION:-1.0}
    container_name: backend
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - minio
    environment:
      # 容器网络内用“服务名”覆盖 application.yml 里的 192.168.149.128
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mrlu}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-mrlu}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-mrlu}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-mrlu}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-mrlumrlu}
      MINIO_BUCKET: demo-bucket
    ports:
      - "8080:8080"

  frontend:
    image: offline-demo-frontend:${APP_VERSION:-1.0}
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"                                 # 想改对外端口就改这里，如 "8081:80"