name: kunlun-package-studio

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      KUNLUN_PLATFORM_DATA_DIR: /data
      KUNLUN_PROJECT_ROOT: /workspace
      KUNLUN_SECRET_KEY: ${KUNLUN_SECRET_KEY:-}
      KUNLUN_METADB_URL: ${KUNLUN_METADB_URL:-}
      KUNLUN_METADB_USER: ${KUNLUN_METADB_USER:-}
      KUNLUN_METADB_PASSWORD: ${KUNLUN_METADB_PASSWORD:-}
      KUNLUN_STORAGE_TYPE: ${KUNLUN_STORAGE_TYPE:-local}
      KUNLUN_MINIO_ENDPOINT: ${KUNLUN_MINIO_ENDPOINT:-}
      KUNLUN_MINIO_ACCESS_KEY: ${KUNLUN_MINIO_ACCESS_KEY:-}
      KUNLUN_MINIO_SECRET_KEY: ${KUNLUN_MINIO_SECRET_KEY:-}
      KUNLUN_MINIO_BUCKET: ${KUNLUN_MINIO_BUCKET:-kunlun-platform}
      TZ: Asia/Shanghai
    volumes:
      - ./.kunlun-builder:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - 8088:80
    restart: unless-stopped

