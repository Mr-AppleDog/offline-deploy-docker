name: kunlun-package-studio

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      KUNLUN_PLATFORM_DATA_DIR: /data
      KUNLUN_PROJECT_ROOT: /workspace
      KUNLUN_SECRET_KEY: ${KUNLUN_SECRET_KEY:-}
      TZ: Asia/Shanghai
    volumes:
      - ./.kunlun-builder:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - 8088:80
    restart: unless-stopped

